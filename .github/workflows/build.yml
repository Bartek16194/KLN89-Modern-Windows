name: Build and Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build KLN89Modern.exe
        shell: cmd
        run: >-
          cl /nologo /std:c++17 /O2 /EHsc src\KLN89Modern.cpp
          /link user32.lib gdi32.lib comdlg32.lib /SUBSYSTEM:WINDOWS /OUT:KLN89Modern.exe

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: KLN89Modern-Windows-x64
          path: KLN89Modern.exe

      - name: Create GitHub Release from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" .\KLN89Modern.exe `
            --title "KLN89 Modern Windows ${{ github.ref_name }}" `
            --generate-notes

      - name: Create GitHub Release from release commit
        if: github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ github.event.head_commit.message }}" -replace '^Release\s+', ''
          gh release create "$version" .\KLN89Modern.exe `
            --target "${{ github.sha }}" `
            --title "KLN89 Modern Windows $version" `
            --generate-notes
